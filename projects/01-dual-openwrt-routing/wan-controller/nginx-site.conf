server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Root and status UI (Readable by LAN)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # State-changing API (Restricted strictly to Admin Workstation, Proxmox Host & Safe Proxy)
    location /api/set {
        allow 127.0.0.1;
        allow 192.168.1.197;  # Admin PC
        allow 192.168.1.2;    # Proxmox Host (Automated power-manager fallback)
        allow 192.168.1.129;  # OpenWrt VM Gateway (NAT for vmbr1 safe zone)
        allow 10.10.10.10;    # nginx-safe reverse proxy (wan.snowfox.live)
        allow 10.10.10.0/24;  # Safe internal zone tier
        deny all;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
