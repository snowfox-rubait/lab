# ==============================================================================
# Nginx Configuration for Safe Internal Reverse Proxy (nginx-safe)
# Location: Proxmox LXC 201 (10.10.10.10 on vmbr1)
# Domain: *.snowfox.live (Split-Horizon Private Resolution)
# SSL/TLS: Let's Encrypt Wildcard (*.snowfox.live) via ACME DNS-01
# ==============================================================================

# Optimized Worker & Connection Settings
# user www-data;
# worker_processes auto;
# pid /run/nginx.pid;

# ------------------------------------------------------------------------------
# 1. Global TLS & Security Parameters
# ------------------------------------------------------------------------------
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Path to Let's Encrypt Wildcard Certificate (Managed via acme.sh or certbot)
ssl_certificate /etc/letsencrypt/live/snowfox.live/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/snowfox.live/privkey.pem;

# Security Headers for Internal Portals
add_header X-Content-Type-Options nosniff always;
add_header X-XSS-Protection "1; mode=block" always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ------------------------------------------------------------------------------
# 2. Global HTTP -> HTTPS Redirection (Port 80)
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------------------
# 3. Default Catch-All HTTPS Block (Landing / Portal)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# ------------------------------------------------------------------------------
# 4. Proxmox Virtual Environment (pve.snowfox.live)
# Upstream: 192.168.1.2:8006 (Proxmox VE Web UI & NoVNC WebSockets)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pve.snowfox.live;

    # Proxmox uses self-signed internal TLS
    location / {
        proxy_pass https://192.168.1.2:8006;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for NoVNC & xterm.js consoles
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

