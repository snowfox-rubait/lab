# /etc/nginx/sites-available/default on LXC 202 (nginx-public - 10.20.20.10)
# End-to-End Encrypted Ingress: Cloudflare Tunnel -> Nginx (HTTPS) -> Vaultwarden (HTTPS)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name vault.snowfox.live;

    client_max_body_size 128M;

    # Admin lockdown: block public access from external tunnel
    location /admin {
        allow 192.168.1.197;
        allow 10.10.10.0/24;
        deny all;

        proxy_pass https://10.20.20.11:8443;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_server_name on;
        proxy_ssl_name vaultwarden.lab;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
    }

    # Vaultwarden Web Notifications / WebSockets
    location /notifications/hub {
        proxy_pass http://10.20.20.11:3012;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
    }

    # Main Vaultwarden Application (LXC 220 over verified mutual internal TLS)
    location / {
        proxy_pass https://10.20.20.11:8443;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_server_name on;
        proxy_ssl_name vaultwarden.lab;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
    }
}
