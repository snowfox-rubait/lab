# /etc/nginx/sites-available/default on LXC 202 (nginx-public - 10.20.20.10)
# Reverse proxy terminating Cloudflare Tunnel and forwarding to Zone 2 services

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name vault.snowfox.live;

    client_max_body_size 128M;

    # Admin lockdown: block public access from external tunnel
    location /admin {
        # Allow internal admin PC workstation (rubait) and Safe Zone
        allow 192.168.1.197;
        allow 10.10.10.0/24;
        deny all;

        proxy_pass http://10.20.20.11:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
    }

    # Vaultwarden Web Notifications / WebSockets
    location /notifications/hub {
        proxy_pass http://10.20.20.11:3012;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
    }

    # Main Vaultwarden Application (LXC 220)
    location / {
        proxy_pass http://10.20.20.11:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
    }
}
