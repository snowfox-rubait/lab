# /etc/nginx/sites-available/default on LXC 202 (nginx-public - 10.20.20.10)
# Hardened Public Ingress: Cloudflare Tunnel -> Nginx -> Vaultwarden (HTTPS :8443)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name vault.snowfox.live;

    client_max_body_size 128M;

    # Restore real visitor IP from Cloudflare Tunnel headers
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    location @notfound {
        return 404 "404 Not Found\n";
    }

    # Admin lockdown: Cloudflare Tunnel operates locally inside container (127.0.0.1).
    # Since external tunnel traffic originates from 127.0.0.1, restrict /admin strictly to internal LAN/VPN management endpoints.
    # Remote visitors over Cloudflare Tunnel (127.0.0.1) receive a stealth 404 Not Found.
    location /admin {
        error_page 403 =404 @notfound;
        allow 192.168.1.197;    # Workstation PC
        allow 10.10.10.0/24;     # Internal management tier
        deny all;                # Deny all external tunnel & other connections (returns stealth 404)

        proxy_pass https://10.20.20.11:8443;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_server_name on;
        proxy_ssl_name vaultwarden.lab;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
    }

    # Vaultwarden Web Notifications / WebSockets
    location /notifications/hub {
        proxy_pass http://10.20.20.11:3012;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
    }

    # Main Vaultwarden Application (LXC 220 over verified mutual internal TLS)
    location / {
        proxy_pass https://10.20.20.11:8443;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_server_name on;
        proxy_ssl_name vaultwarden.lab;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
    }
}
